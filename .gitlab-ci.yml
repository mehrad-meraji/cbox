stages:
  - publish
  - pages
  - docker

publish:npm:
  stage: publish
  image: node:20
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - apt-get update -qq && apt-get install -y curl unzip
    - curl -fsSL https://bun.sh/install | bash
    - export PATH="$HOME/.bun/bin:$PATH"
  script:
    - export PATH="$HOME/.bun/bin:$PATH"
    - bun install --frozen-lockfile
    - bun run build
    - echo "//registry.npmjs.org/:_authToken=${NPM_PUBLISH_TOKEN}" > .npmrc
    - VERSION=$(node -p "require('./package.json').version")
    - npm view "@_mehrad/cbox@${VERSION}" version 2>/dev/null && echo "Version ${VERSION} already published, skipping." || npm publish --access public
  after_script:
    - rm -f .npmrc

publish:docker:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  variables:
    DOCKER_BUILDKIT: "1"
  script:
    - VERSION=$(echo "$CI_COMMIT_TAG" | sed 's/^v//')
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker buildx create --use
    - docker buildx build --platform linux/amd64,linux/arm64
        -t mehradm/cbox:latest
        -t mehradm/cbox:${VERSION}
        -f docker/Dockerfile
        --push
        .
  after_script:
    - docker logout

pages:
  stage: pages
  image: alpine
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "Deploying GitLab Pages"
  artifacts:
    paths:
      - public

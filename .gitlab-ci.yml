stages:
  - deploy
  - publish

pages:
  stage: deploy
  script:
    - VERSION=$(grep '"version"' package.json | head -1 | awk -F'"' '{print $4}')
    - sed -i "s/class=\"nav-ver\">v[0-9][0-9.]*/class=\"nav-ver\">v${VERSION}/g" public/index.html
    - echo "Deploying cbox landing page v${VERSION} to GitLab Pages"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

docker-image:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    IMAGE: registry.gitlab.com/mehrad.meraji/cbox
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE:$CI_COMMIT_TAG -t $IMAGE:latest docker/
    - docker push $IMAGE:$CI_COMMIT_TAG
    - docker push $IMAGE:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

npm-publish:
  stage: publish
  image: node:20
  before_script:
    - curl -fsSL https://bun.sh/install | bash
    - export PATH="$HOME/.bun/bin:$PATH"
    - |
      if [ -z "$NPM_PUBLISH_TOKEN" ]; then
        echo "ERROR: NPM_PUBLISH_TOKEN is empty or not set."
        exit 1
      fi
    - npm config set //registry.npmjs.org/:_authToken "${NPM_PUBLISH_TOKEN}"
  script:
    - bun install --frozen-lockfile
    - bun run build
    - VERSION=$(node -p "require('./package.json').version")
    - npm view "@_mehrad/cbox@${VERSION}" version 2>/dev/null && echo "Version ${VERSION} already published, skipping." || npm publish --access public
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

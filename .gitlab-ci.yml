stages:
  - deploy
  - publish

pages:
  stage: deploy
  script:
    - echo "Deploying cbox landing page to GitLab Pages"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

publish:
  stage: publish
  image: oven/bun:latest
  before_script:
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
  script:
    - bun install --frozen-lockfile
    - bun run build
    - VERSION=$(bun -e "console.log(require('./package.json').version)")
    - npm view "@_mehrad/cbox@${VERSION}" version 2>/dev/null && echo "Version ${VERSION} already published, skipping." || npm publish --access public
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

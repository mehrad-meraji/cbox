stages:
  - deploy
  - publish

pages:
  stage: deploy
  script:
    - echo "Deploying cbox landing page to GitLab Pages"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

docker-image:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    IMAGE: registry.gitlab.com/mehrad.meraji/cbox
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE:$CI_COMMIT_TAG -t $IMAGE:latest docker/
    - docker push $IMAGE:$CI_COMMIT_TAG
    - docker push $IMAGE:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

npm-publish:
  stage: publish
  image: oven/bun:latest
  before_script:
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
  script:
    - bun install --frozen-lockfile
    - bun run build
    - VERSION=$(bun -e "console.log(require('./package.json').version)")
    - STATUS=$(bun -e "fetch('https://registry.npmjs.org/@_mehrad%2Fcbox/${VERSION}').then(r=>process.stdout.write(String(r.status)))" 2>/dev/null)
    - if [ "$STATUS" = "200" ]; then echo "Version ${VERSION} already published, skipping."; else bun publish --access public; fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

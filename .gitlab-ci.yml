stages:
  - deploy
  - publish

pages:
  stage: deploy
  script:
    - echo "Deploying cbox landing page to GitLab Pages"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

docker-image:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    IMAGE: registry.gitlab.com/mehrad.meraji/cbox
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE:$CI_COMMIT_TAG -t $IMAGE:latest docker/
    - docker push $IMAGE:$CI_COMMIT_TAG
    - docker push $IMAGE:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

npm-publish:
  stage: publish
  image: node:20
  before_script:
    - curl -fsSL https://bun.sh/install | bash
    - export PATH="$HOME/.bun/bin:$PATH"
    - |
      if [ -z "$NPM_TOKEN" ]; then
        echo "ERROR: NPM_TOKEN is empty or not set. Go to GitLab > Settings > CI/CD > Variables and verify NPM_TOKEN exists and is NOT marked as Protected."
        exit 1
      fi
    - npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
  script:
    - bun install --frozen-lockfile
    - bun run build
    - VERSION=$(node -p "require('./package.json').version")
    - npm view "@_mehrad/cbox@${VERSION}" version 2>/dev/null && echo "Version ${VERSION} already published, skipping." || npm publish --access public
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
